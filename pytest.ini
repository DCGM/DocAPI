[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_date_format = %H:%M:%S
# The local SMTP test server allows AUTH over implicit SSL, which aiosmtpd does
# not count as TLS (conftest.py).
filterwarnings =
    ignore:Requiring AUTH while not requiring TLS:UserWarning
