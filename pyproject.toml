[build-system]
requires = [ "setuptools>=61" ]

[project]
name = "doc-api"
version = "0.0.0"
description = "DocAPI"
authors = [
    {name = "Jan Kohút", email = "ikohut@fit.vut.cz"},
    {name = "Martin Kišš", email = "ikiss@fit.vut.cz"},
    {name = "Michal Hradiš", email = "ihradis@fit.vut.cz"}
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.12"
# Everything the shared layer imports: doc_api.connector, doc_api.adapter,
# doc_api.api.schemas and doc_api.tools.mail_sender. Installing doc-api on its
# own gives a usable worker or client without pulling in the service stack.
# The packages the server shares with the worker and the client follow the
# versions the server runs (doc_api/requirements.txt, which pins them exactly);
# here any patch release of them is allowed. test_dependency_versions.py keeps
# the two in step. OpenCV is the headless build: nothing here opens a window.
dependencies = [
    "fastapi~=0.165.0",
    "numpy~=2.5.5",
    "opencv-python-headless~=5.1.0.95",
    "pydantic[email]~=2.14.4",
    "Requests"
]

[project.optional-dependencies]
# Running the API service itself. SQLAlchemy's postgresql_asyncpg extra covers
# the asyncpg driver named in the DATABASE_URL and the greenlet its async engine
# runs on; neither is imported directly, and greenlet is otherwise only
# installed on some architectures. python-multipart is likewise never imported
# -- FastAPI needs it to parse uploads.
server = [
    "aiofiles",
    "alembic",
    "defusedxml",
    "natsort",
    "python-multipart",
    "SQLAlchemy[postgresql_asyncpg]",
    "starlette~=1.10.0",
    "uvicorn"
]

# doc_worker needs nothing beyond the base. Declared so that consumers can
# depend on doc-api[worker] and keep working if that stops being true.
worker = []

client = [
    "natsort"
]

dev = [
    "aiosmtpd",
    "httpx",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest_asyncio"
]

all = [
    "doc-api[server,worker,client,dev]"
]

[project.urls]
repository = "https://github.com/DCGM/DocAPI"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.*"]
"doc_api" = ["api/static/monitor/*.html", "api/static/monitor/*.css", "api/static/monitor/*.js"]

[tool.setuptools.package-dir]
"doc_api" = "doc_api"
"doc_client" = "doc_client"
"doc_worker" = "doc_worker"

[project.scripts]
doc_api = "doc_api.run:main"
