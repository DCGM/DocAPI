[build-system]
requires = [ "setuptools>=61" ]

[project]
name = "doc-api"
version = "0.0.0"
description = "DocAPI"
authors = [
    {name = "Jan Kohút", email = "ikohut@fit.vut.cz"},
    {name = "Martin Kišš", email = "ikiss@fit.vut.cz"},
    {name = "Michal Hradiš", email = "ihradis@fit.vut.cz"}
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.12"
# Everything the shared layer imports: doc_api.connector, doc_api.api.schemas
# and doc_api.tools.mail_sender. Installing doc-api on its own does not pull in
# the service stack.
# No versions: the server's are pinned in doc_api/requirements.txt, which the
# Docker image installs and this repository develops and tests with. Workers
# and clients in other projects choose their own versions of these packages;
# only the Python version is required (see AGENTS.md).
dependencies = [
    "fastapi",
    "numpy",
    "pydantic[email]",
    "Requests"
]

[project.optional-dependencies]
# Running the API service itself. SQLAlchemy's postgresql_asyncpg extra covers
# the asyncpg driver named in the DATABASE_URL and the greenlet its async engine
# runs on; neither is imported directly, and greenlet is otherwise only
# installed on some architectures. python-multipart is likewise never imported
# -- FastAPI needs it to parse uploads.
# OpenCV is in the extras, not the base, because the server and the projects
# using DocAPI want different builds of the same cv2 module: the server the
# headless one, as its image does, workers and clients usually the full one.
server = [
    "aiofiles",
    "alembic",
    "defusedxml",
    "natsort",
    "opencv-python-headless",
    "python-multipart",
    "SQLAlchemy[postgresql_asyncpg]",
    "starlette",
    "uvicorn"
]

# doc_worker: OpenCV decodes downloaded images (doc_api.adapter).
worker = [
    "opencv-python"
]

client = [
    "natsort",
    "opencv-python"
]

dev = [
    "aiosmtpd",
    "httpx",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest_asyncio"
]

# Everything for working on this repository, with the server's OpenCV build
# only: the worker and client extras would add a second one.
all = [
    "doc-api[server,dev]"
]

[project.urls]
repository = "https://github.com/DCGM/DocAPI"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.*"]
"doc_api" = ["api/static/monitor/*.html", "api/static/monitor/*.css", "api/static/monitor/*.js"]

[tool.setuptools.package-dir]
"doc_api" = "doc_api"
"doc_client" = "doc_client"
"doc_worker" = "doc_worker"

[project.scripts]
doc_api = "doc_api.run:main"
